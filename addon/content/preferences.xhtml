<groupbox id="zotero-prefpane-__addonRef__">
  <label><html:h2>AI-notes2obsidian</html:h2></label>
  <description>将选中的 Zotero 文献发送到已配置的 n8n 工作流。</description>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-webhook-url"
      >Webhook URL</html:label
    >
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-webhook-url"
      preference="webhookURL"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-webhook-token"
      >Webhook Token</html:label
    >
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-webhook-token"
      preference="webhookToken"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-request-timeout"
      >请求超时（秒）</html:label
    >
    <html:input
      type="number"
      min="1"
      id="zotero-prefpane-__addonRef__-request-timeout"
      preference="requestTimeoutSeconds"
    ></html:input>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-use-abstract-fallback"
    preference="useAbstractFallback"
    label="无法读取全文时使用摘要"
  />
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-template">模板</html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-template"
      preference="template"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-language"
      >输出语言</html:label
    >
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-language"
      preference="language"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-subfolder"
      >Obsidian 子目录</html:label
    >
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-subfolder"
      preference="subfolder"
    ></html:input>
  </hbox>
</groupbox>
